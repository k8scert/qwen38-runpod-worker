name: Build isolated A40 tuning candidate
on:
  push:
    branches: [main]
    paths: ['tuning/**', '.github/workflows/build-tuning.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: a40-tuning-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate syntax
        run: |
          bash -n tuning/start.sh
          python3 -m py_compile tuning/handler.py
          python3 -m pip install --quiet aiohttp
          python3 -m unittest discover -s tuning -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build immutable candidate without replacing production tag
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tuning/Dockerfile
          push: true
          tags: k8scert/qwen38-runpod-worker:a40-tune-${{ github.sha }}
          cache-from: type=gha,scope=a40-tuning
          cache-to: type=gha,scope=a40-tuning,mode=max
      - name: Save image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: k8scert/qwen38-runpod-worker:a40-tune-%s\nDigest: %s\n' "${GITHUB_SHA}" "${IMAGE_DIGEST}" | tee image.txt >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: a40-tuning-image
          path: image.txt
