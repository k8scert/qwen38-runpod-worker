name: Copy Q8_0 Model to Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade huggingface_hub

      - name: Server-side copy Q8_0 model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]

          source = (
              "hf://Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF/"
              "Qwen3.8-27B-ABLITERATED-Q8_0.gguf"
          )
          destination = (
              "hf://k8scert/Qwen3.8-27B-ABLITERATED-Q8_0/"
              "Qwen3.8-27B-ABLITERATED-Q8_0.gguf"
          )

          print("Starting Hugging Face server-side copy...")
          api = HfApi(token=token)
          result = api.copy_files(source, destination, token=token)
          print("Copy result:", result)
          PY

      - name: Verify destination file
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "k8scert/Qwen3.8-27B-ABLITERATED-Q8_0"
          filename = "Qwen3.8-27B-ABLITERATED-Q8_0.gguf"

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.model_info(repo_id, files_metadata=True)

          matches = [s for s in info.siblings if s.rfilename == filename]

          if not matches:
              raise SystemExit(f"[FAIL] Missing destination file: {filename}")

          item = matches[0]
          size = getattr(item, "size", None)
          print(f"[OK] Found: {filename}")
          print(f"[OK] Size: {size} bytes")
          print("P13B-3A MODEL COPY ALL CHECKS OK")
          PY
