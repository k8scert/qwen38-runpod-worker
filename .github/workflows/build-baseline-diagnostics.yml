name: Build preserved-engine diagnostics
on:
  push:
    branches: [main]
    paths: ['baseline-diagnostics/**', '.github/workflows/build-baseline-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build immutable diagnostic image with preserved declared engine
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: baseline-diagnostics/Dockerfile
          push: true
          tags: k8scert/qwen38-runpod-worker:a40-baseline-diag-${{ github.sha }}
      - name: Record diagnostic image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "${IMAGE_DIGEST}" | tee baseline-diagnostic-image.txt >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-diagnostic-image
          path: baseline-diagnostic-image.txt
